{% extends "base.html" %}
{% block title %}Просмотр: {{ filename }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4>📄 {{ filename }}</h4>
    <div>
        <a href="/download/{{ category }}/{{ filename }}" class="btn btn-primary">📥 Скачать</a>
        <a href="/documents/{{ category }}" class="btn btn-secondary">← Назад</a>
    </div>
</div>
<div class="card">
    <div class="card-body text-center">
        <p>Просмотр файла <strong>{{ filename }}</strong> из категории <strong>{{ category_name }}</strong></p>
        <p>Для просмотра файла, пожалуйста, <a href="/download/{{ category }}/{{ filename }}">скачайте его</a> и откройте на устройстве.</p>
    </div>
</div>
{% endblock %}
